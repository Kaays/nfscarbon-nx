# nfscarbon-nx: code generator options for the de edition (see overrides.toml for what they do).
# setjmp found by tools/make_edition_manifest.py (usa 0x8279D060).

cr_as_local = true
non_volatile_as_local = false
xer_as_local = true
ctr_as_local = true

[functions]
# Bounds set by hand (pal2 0x827CFDA8): a switch table the scanner misses.
"0x827D0548" = { end = 0x827D0AA0 }
# setjmp: share_registers so the jmp_buf gets the caller's cr.
"0x8279C750" = { share_registers = true }

[[switch_tables]]
address = 0x827D079C
register = 11
labels = [0x827D07B0, 0x827D07BC, 0x827D07C8, 0x827D07B0]

[[switch_tables]]
address = 0x827D0958
register = 11
labels = [0x827D096C, 0x827D0984, 0x827D09AC, 0x827D096C]
